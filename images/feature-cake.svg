<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2C2C2C" rx="50"/>
  <!-- Cake base / bottom tier -->
  <rect x="18" y="62" width="64" height="18" rx="3" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <!-- Cake middle tier -->
  <rect x="26" y="44" width="48" height="18" rx="3" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <!-- Cake top tier -->
  <rect x="34" y="28" width="32" height="16" rx="3" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <!-- Frosting drips on bottom tier -->
  <path d="M24,62 Q27,57 30,62" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <path d="M38,62 Q41,57 44,62" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <path d="M54,62 Q57,57 60,62" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <path d="M68,62 Q71,57 74,62" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Frosting drips on middle tier -->
  <path d="M32,44 Q35,39 38,44" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <path d="M48,44 Q51,39 54,44" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <path d="M62,44 Q65,39 68,44" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Candle -->
  <rect x="47" y="20" width="6" height="10" rx="1" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Flame -->
  <path d="M50,20 C48,16 46,14 50,11 C54,14 52,16 50,20 Z" fill="#C9A84C" opacity="0.8"/>
  <!-- Decorative dots on tiers -->
  <circle cx="50" cy="53" r="1.5" fill="#C9A84C"/>
  <circle cx="40" cy="53" r="1.5" fill="#C9A84C"/>
  <circle cx="60" cy="53" r="1.5" fill="#C9A84C"/>
  <circle cx="50" cy="71" r="1.5" fill="#C9A84C"/>
  <circle cx="36" cy="71" r="1.5" fill="#C9A84C"/>
  <circle cx="64" cy="71" r="1.5" fill="#C9A84C"/>
  <!-- Base plate -->
  <ellipse cx="50" cy="80" rx="36" ry="3" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.5"/>
</svg>
