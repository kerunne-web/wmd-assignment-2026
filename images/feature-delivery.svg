<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#2C2C2C" rx="50"/>
  <!-- Van body -->
  <rect x="10" y="38" width="52" height="28" rx="3" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <!-- Van cab -->
  <path d="M62,52 L62,38 L80,38 L88,52 Z" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linejoin="round"/>
  <!-- Window on cab -->
  <path d="M65,41 L65,50 L84,50 L79,41 Z" fill="#C9A84C" opacity="0.25"/>
  <!-- Wheels -->
  <circle cx="28" cy="68" r="8" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <circle cx="28" cy="68" r="3" fill="#C9A84C"/>
  <circle cx="72" cy="68" r="8" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <circle cx="72" cy="68" r="3" fill="#C9A84C"/>
  <!-- Ground line -->
  <line x1="8" y1="76" x2="92" y2="76" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>
  <!-- Cake box on van -->
  <rect x="22" y="42" width="20" height="16" rx="1" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Ribbon on box -->
  <line x1="32" y1="42" x2="32" y2="58" stroke="#C9A84C" stroke-width="1"/>
  <line x1="22" y1="50" x2="42" y2="50" stroke="#C9A84C" stroke-width="1"/>
  <!-- Speed lines -->
  <line x1="2" y1="44" x2="10" y2="44" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
  <line x1="4" y1="50" x2="10" y2="50" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
  <line x1="2" y1="56" x2="10" y2="56" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
</svg>
